apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-consumer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://host.minikube.internal:9080/platform.git
    targetRevision: main
    path: manifests/edge
  destination:
    name: qoves-edge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
