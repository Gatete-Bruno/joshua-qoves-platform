apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: qoves-db-restored
  namespace: qoves-app
spec:
  instances: 1
  imageName: registry:5000/postgresql:18.4-standard-trixie@sha256:ae0ec6943c3c24b0de87f93b73ac531a8e546a4cc895655f793547eed2fdbef1
  storage:
    size: 1Gi
    storageClass: csi-hostpath-sc
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    recovery:
      source: qoves-db
  externalClusters:
    - name: qoves-db
      barmanObjectStore:
        destinationPath: s3://qoves-backups/qoves-db
        endpointURL: http://minio.qoves-minio.svc.cluster.local:9000
        s3Credentials:
          accessKeyId:
            name: db-backup-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: db-backup-s3
            key: SECRET_ACCESS_KEY
        wal:
          compression: gzip
