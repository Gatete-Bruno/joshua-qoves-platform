apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-egress
  namespace: qoves-app
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: qoves-db
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: qoves-db
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qoves-minio
      ports:
        - port: 9000
          protocol: TCP
